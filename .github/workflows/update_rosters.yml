name: Update NFL Rosters

on:
  schedule:
    - cron: "0 9 * * 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R Environment
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libxml2-dev

      - name: Install R Packages
        run: |
          Rscript -e '
            install.packages(
              c("nflreadr", "readr"),
              repos = c("https://nflverse.r-universe.dev", "https://cloud.r-project.org")
            )
          '

      - name: Fetch Live Rosters and Officials
        run: |
          Rscript -e '
            suppressPackageStartupMessages({
              library(nflreadr)
              library(readr)
            })

            if (!dir.exists("data")) dir.create("data", recursive = TRUE)

            # 1. Officials
            officials <- tryCatch(load_officials(), error = function(e) NULL)
            if (!is.null(officials)) write_csv(officials, "data/officials.csv")

            # 2. Live Rosters
            target_season <- most_recent_season(roster = TRUE)
            rosters <- tryCatch(load_rosters(seasons = target_season), error = function(e) NULL)
            if (!is.null(rosters)) {
              write_csv(rosters, "data/rosters_current.csv")
              write_csv(rosters, paste0("data/rosters_", target_season, ".csv"))
            }

            # 3. Weekly Rosters (Depth Charts / Inactives)
            rosters_weekly <- tryCatch(load_rosters_weekly(seasons = target_season), error = function(e) NULL)
            if (!is.null(rosters_weekly)) {
              write_csv(rosters_weekly, "data/rosters_weekly_current.csv")
              write_csv(rosters_weekly, paste0("data/rosters_weekly_", target_season, ".csv"))
            }
          '

      - name: Auto-Commit Back to Repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update live NFL rosters and officials [skip ci]"
          file_pattern: "data/*.csv"
