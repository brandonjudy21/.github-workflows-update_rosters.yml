name: Update NFL Rosters

on:
  schedule:
    - cron: "0 9 * * 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R Environment
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libxml2-dev

      - name: Install R Packages
        run: |
          Rscript -e '
            install.packages(
              c("nflreadr", "readr"),
              repos = c("https://nflverse.r-universe.dev", "https://cloud.r-project.org")
            )
          '

      - name: Fetch Live Rosters, Schedules, Injuries, Snaps, and NGS
        run: |
          Rscript -e '
            suppressPackageStartupMessages({
              library(nflreadr)
              library(readr)
            })

            if (!dir.exists("data")) dir.create("data", recursive = TRUE)

            target_season <- most_recent_season(roster = TRUE)

            # 1. Base Administrative Feeds
            write_csv(load_officials(), "data/officials.csv")
            write_csv(load_rosters_weekly(target_season), "data/rosters_weekly_current.csv")

            # 2. Injuries (practice participation & game status)
            write_csv(load_injuries(target_season), "data/injuries_current.csv")

            # 3. Schedules (rest days, roof types, consensus totals)
            write_csv(load_schedules(target_season), "data/schedules_current.csv")

            # 4. Snap Counts (offensive/defensive usage rates)
            write_csv(load_snap_counts(target_season), "data/snap_counts_current.csv")

            # 5. Next Gen Stats Passing (Isolated TTT & CPOE)
            ngs_raw <- load_nextgen_stats(target_season, "passing")
            ngs_cols <- c("season", "week", "player_display_name", "team_abbr", 
                          "avg_time_to_throw", "completion_percentage_above_expectation", "aggressiveness")
            ngs_pass <- ngs_raw[, intersect(ngs_cols, names(ngs_raw))]
            write_csv(ngs_pass, "data/ngs_qb_current.csv")
          '

      - name: Auto-Commit Back to Repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update live rosters, injuries, schedules, snaps, and NGS [skip ci]"
          file_pattern: "data/*.csv"
